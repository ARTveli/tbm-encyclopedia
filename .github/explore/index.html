<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TBM Полиця</title>
<meta name="description" content="Інтерактивна полиця та граф музикантів лейблу Three Blind Mice">
<link rel="icon" href="../static/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe6; --panel:#fbf8f2; --ink:#1d1a16; --muted:#6f675c; --line:#ddd4c5;
  --accent:#b4432b; --accent-ink:#fff; --chip:#ebe3d5; --shadow:0 10px 30px rgba(40,30,15,.12);
  --node:#8a7f70; --node-hi:#b4432b; --edge:rgba(60,50,35,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14120f; --panel:#1d1a16; --ink:#efe8dc; --muted:#a39a8c; --line:#332e27;
    --accent:#e0694d; --accent-ink:#14120f; --chip:#2a2620; --shadow:0 10px 30px rgba(0,0,0,.45);
    --node:#8d8475; --node-hi:#e0694d; --edge:rgba(239,232,220,.08);
  }
}
:root[data-theme="dark"]{
  --bg:#14120f; --panel:#1d1a16; --ink:#efe8dc; --muted:#a39a8c; --line:#332e27;
  --accent:#e0694d; --accent-ink:#14120f; --chip:#2a2620; --shadow:0 10px 30px rgba(0,0,0,.45);
  --node:#8d8475; --node-hi:#e0694d; --edge:rgba(239,232,220,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,sans-serif}
a{color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:14px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand img{width:34px;height:34px;border-radius:50%}
.brand b{font-size:18px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:999px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:7px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
main{max-width:1280px;margin:0 auto;padding:16px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
input[type=search]{flex:1 1 260px;min-width:0;font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{font:inherit;font-size:14px;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-self:start}
.sleeve{aspect-ratio:1;border-radius:4px;overflow:hidden;position:relative;box-shadow:var(--shadow);transition:transform .2s}
.card:hover .sleeve,.card:focus-visible .sleeve{transform:translateY(-4px)}
.sleeve img{width:100%;height:100%;object-fit:cover;display:block}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#fff}
.gen .c{font-family:"IBM Plex Mono",monospace;font-size:12px;opacity:.85}
.gen .t{font-weight:700;font-size:17px;line-height:1.15}
.gen .disc{position:absolute;right:-30%;top:15%;width:70%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#1d1d1d 2px 4px);opacity:.55}
.gen .disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:rgba(255,255,255,.75)}
.badge{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.badge i{font-style:normal;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:4px}
.meta{margin-top:8px;font-size:14px;line-height:1.3}
.meta b{display:block;font-weight:600}
.meta small{color:var(--muted)}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* ── drawer ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--panel);z-index:50;overflow-y:auto;transform:translateX(100%);transition:transform .25s;box-shadow:var(--shadow)}
.drawer.open{transform:none}
.dhead{display:flex;gap:16px;padding:20px;border-bottom:1px solid var(--line)}
.dhead .sleeve{width:140px;flex:none}
.dhead h2{margin:4px 0 6px;font-size:22px;line-height:1.15}
.dhead p{margin:0;color:var(--muted)}
.close{position:sticky;top:0;float:right;margin:10px;border:0;background:var(--chip);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;z-index:2}
.dbody{padding:4px 20px 28px}
.dbody h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.people button:hover{border-color:var(--accent);color:var(--accent)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.review{font-size:15px;line-height:1.6}
.review p{margin:0 0 .9em}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}

/* ── graph ── */
.gwrap{display:grid;grid-template-columns:1fr 320px;gap:16px;height:calc(100vh - 170px);min-height:480px}
.gcanvas{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:grab}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:5px 9px;border-radius:6px;transform:translate(-50%,-140%);white-space:nowrap;display:none}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-y:auto}
.side h2{margin:0 0 4px;font-size:20px}
.side p{color:var(--muted);margin:0 0 10px;font-size:14px}
.side ul{list-style:none;padding:0;margin:0}
.side li button{width:100%;text-align:left;font:inherit;font-size:14px;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;color:var(--ink);cursor:pointer;display:flex;gap:8px}
.side li button:hover{color:var(--accent)}
.side li .mono{color:var(--muted);font-size:12px;min-width:96px;white-space:nowrap}
.legend{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .gwrap{grid-template-columns:1fr;height:auto}
  .gcanvas{height:62vh}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
  .dhead .sleeve{width:100px}
}
/* ── timeline ── */
.hist{position:sticky;top:69px;z-index:10;background:var(--bg);padding:10px 0 6px;margin-bottom:8px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-end;gap:2px;height:118px;overflow-x:auto}
.hcol{flex:1 0 14px;min-width:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font:inherit}
.hcol .hb{width:100%;max-width:26px;background:var(--chip);border-radius:3px 3px 0 0;position:relative;overflow:hidden}
.hcol .hb i{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
.hcol:hover .hb{background:var(--line)}
.hcol.cur .hb{outline:2px solid var(--ink);outline-offset:1px}
.hcol .ev{width:5px;height:5px;border-radius:50%;background:var(--ink);margin-top:3px;opacity:0}
.hcol .ev.on{opacity:.7}
.hcol small{font-size:10px;height:13px;line-height:13px;font-family:"IBM Plex Mono",monospace}
.yr{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);scroll-margin-top:200px}
.yr h2{margin:0;font-size:34px;line-height:1;font-family:"IBM Plex Mono",monospace;font-weight:600}
.yr h2 + p{margin:6px 0 0;color:var(--muted);font-size:13px}
.ycov{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
.ycov .card .sleeve{box-shadow:0 3px 10px rgba(0,0,0,.15)}
.ycov .gen{padding:6px}.ycov .gen .t{font-size:10px}.ycov .gen .c{font-size:8px}
.ycov .badge{top:4px;right:4px}.ycov .badge i{font-size:9px;padding:1px 4px}
.ycov .card.dim{opacity:.18}
.ycov .card.hit .sleeve{outline:3px solid var(--accent);outline-offset:2px}
.evs{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.evs li{font-size:14px;line-height:1.5;padding-left:14px;border-left:2px solid var(--accent)}
.evs b{font-weight:600}
.evs button{font:inherit;font-size:13px;border:0;background:var(--chip);color:var(--ink);border-radius:4px;padding:0 5px;cursor:pointer;font-family:"IBM Plex Mono",monospace}
.evs button:hover{background:var(--accent);color:var(--accent-ink)}
@media (max-width:820px){ .yr{grid-template-columns:1fr;gap:10px;scroll-margin-top:130px} .yr h2{font-size:26px} .hist{position:static} }
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="../"><img src="../static/icon.png" alt=""><div><b>TBM Полиця</b><br><span>← до енциклопедії</span></div></a>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-shelf" aria-selected="true">Полиця</button>
      <button role="tab" id="t-graph" aria-selected="false">Музиканти</button>
      <button role="tab" id="t-time" aria-selected="false">Хронологія</button>
    </div>
  </div>
</header>

<main>
  <section id="v-shelf">
    <div class="controls">
      <input type="search" id="q" placeholder="Назва, артист, музикант, TBM-номер…" autocomplete="off">
      <div id="decades" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      <button class="chip" id="f-awards" aria-pressed="false">★ Нагороди</button>
      <button class="chip" id="f-liner" aria-pressed="false">📝 Liner notes</button>
      <select id="sort" aria-label="Сортування">
        <option value="year">За роком</option>
        <option value="cat">За каталогом</option>
        <option value="title">За назвою</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>Нічого не знайдено</div>
  </section>

  <section id="v-graph" hidden>
    <div class="controls">
      <input type="search" id="gq" placeholder="Знайти музиканта…" list="artist-list" autocomplete="off">
      <datalist id="artist-list"></datalist>
      <button class="chip" id="g-all" aria-pressed="false">Показати всіх</button>
      <button class="chip" id="g-reset">Скинути</button>
    </div>
    <div class="gwrap">
      <div class="gcanvas"><canvas id="cv"></canvas><div class="tip" id="tip"></div>
        <div class="legend">Розмір — кількість альбомів · лінія — спільні записи</div></div>
      <aside class="side" id="side"></aside>
    </div>
  </section>
  <section id="v-time" hidden>
    <div class="controls">
      <input type="search" id="tq" placeholder="Підсвітити музиканта або звукорежисера…" list="hl-list" autocomplete="off">
      <datalist id="hl-list"></datalist>
      <button class="chip" id="t-reset">Скинути</button>
      <span class="count" id="tcount"></span>
    </div>
    <div class="hist" id="hist"></div>
    <div id="years"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const BASE = "../";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pageUrl = p => BASE + p.split("/").map(encodeURIComponent).join("/");

let DB, ALB = new Map(), BY_ARTIST = new Map();

/* кольори обкладинок-заглушок: стабільні від каталожного номера */
const PALETTE = ["#8c2f1f","#1f4e5f","#5b3a6b","#2f5d3a","#7a5a1c","#38404f","#6b2f45","#1d5a52","#4f3b2a","#2a3f6b"];
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function sleeve(a){
  const badges = [a.awards?"<i>★</i>":"", a.liner.length?"<i>📝</i>":""].join("");
  if (a.cover) return `<div class="sleeve"><img loading="lazy" src="${BASE}${esc(a.cover)}" alt="${esc(a.title)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'gen',innerHTML:'<span class=c>${esc(a.cat)}</span>'}))"><div class="badge">${badges}</div></div>`;
  return `<div class="sleeve" style="background:${PALETTE[hash(a.cat)%PALETTE.length]}"><div class="gen"><div class="disc"></div><span class="c">${esc(a.cat)}</span><span class="t">${esc(a.title)}</span></div><div class="badge">${badges}</div></div>`;
}

/* ── завантаження ── */
fetch("data.json").then(r=>r.json()).then(d=>{
  DB = d;
  for (const a of d.albums){
    ALB.set(a.id, a);
    for (const p of a.personnel){ if(!BY_ARTIST.has(p)) BY_ARTIST.set(p,[]); BY_ARTIST.get(p).push(a); }
  }
  for (const f of [initShelf, initGraph, initTimeline]){ try{ f(); }catch(e){ console.error(f.name, e); } }
  route();
}).catch(e=>{ console.error(e); $("#grid").innerHTML = '<p class="empty">Не вдалося завантажити дані.</p>'; });

/* ── вкладки ── */
let TAB = "shelf";
function setTab(t){
  TAB = t;
  for (const k of ["shelf","graph","time"]){
    $("#t-"+k).setAttribute("aria-selected", k===t); $("#v-"+k).hidden = k!==t; }
  if (t==="graph") G.resize();
}
const tabHash = () => TAB==="shelf" ? "#" : "#"+TAB;
$("#t-shelf").onclick = ()=>{ setTab("shelf"); history.replaceState(null,"","#"); };
$("#t-graph").onclick = ()=>{ setTab("graph"); history.replaceState(null,"","#graph"); };
$("#t-time").onclick  = ()=>{ setTab("time");  history.replaceState(null,"","#time"); };

/* ── ПОЛИЦЯ ── */
const F = {q:"", decade:"all", awards:false, liner:false, sort:"year"};
function initShelf(){
  const decs = [["all","Усі"],["1960","60-ті"],["1970","70-ті"],["1980","80-ті"],["1990","90-ті+"]];
  $("#decades").innerHTML = decs.map(([k,l])=>`<button class="chip" data-d="${k}" aria-pressed="${k==="all"}">${l}</button>`).join("");
  $("#decades").onclick = e=>{ const b=e.target.closest("button"); if(!b)return; F.decade=b.dataset.d;
    [...$("#decades").children].forEach(x=>x.setAttribute("aria-pressed", x===b)); renderShelf(); };
  $("#q").oninput = e=>{ F.q = e.target.value.trim().toLowerCase(); renderShelf(); };
  for (const k of ["awards","liner"]) $("#f-"+k).onclick = e=>{ F[k]=!F[k]; e.currentTarget.setAttribute("aria-pressed",F[k]); renderShelf(); };
  $("#sort").onchange = e=>{ F.sort=e.target.value; renderShelf(); };
  $("#grid").onclick = e=>{ const c=e.target.closest(".card"); if(c) openAlbum(c.dataset.id); };
  renderShelf();
}
function match(a){
  if (F.awards && !a.awards) return false;
  if (F.liner && !a.liner.length) return false;
  if (F.decade!=="all"){ const y=a.year||0, d=+F.decade;
    if (d===1990 ? y<1990 : (y<d || y>=d+10)) return false; }
  if (!F.q) return true;
  const hay = [a.cat,a.title,a.title_ua,a.artist,a.artist_en,a.engineer,...a.personnel].join(" ").toLowerCase();
  return F.q.split(/\s+/).every(w=>hay.includes(w));
}
function renderShelf(){
  const list = DB.albums.filter(match);
  const s = F.sort;
  list.sort((a,b)=> s==="title" ? a.title.localeCompare(b.title) :
    s==="cat" ? a.cat.localeCompare(b.cat,undefined,{numeric:true}) : (a.year||9999)-(b.year||9999) || a.cat.localeCompare(b.cat,undefined,{numeric:true}));
  $("#grid").innerHTML = list.map(a=>`<button class="card" data-id="${esc(a.id)}">${sleeve(a)}
    <div class="meta"><b>${esc(a.title)}</b><small>${esc(a.artist)}${a.year?" · "+a.year:""}</small></div></button>`).join("");
  $("#count").textContent = `${list.length} з ${DB.albums.length}`;
  $("#empty").hidden = list.length>0;
}


/* ── картка альбому ── */
function openAlbum(id){
  const a = ALB.get(id); if(!a) return;
  const liner = a.liner.map(l=>`<a class="btn ghost" href="${pageUrl(l.url)}">📝 Liner notes · ${esc(l.author)}</a>`).join("");
  $("#drawer").innerHTML = `
    <button class="close" aria-label="Закрити">×</button>
    <div class="dhead">${sleeve(a)}<div>
      <span class="mono" style="color:var(--muted);font-size:13px">${esc(a.cat)}${a.year?" · "+a.year:""}</span>
      <h2>${esc(a.title)}</h2>${a.title_ua?`<p>${esc(a.title_ua)}</p>`:""}
      <p style="color:var(--ink);margin-top:6px">${esc(a.artist)}</p></div></div>
    <div class="dbody">
      <div class="links"><a class="btn" href="${pageUrl(a.url)}">Повна сторінка →</a>${liner}</div>
      ${a.personnel.length?`<h3>Склад</h3><div class="people">${a.personnel.map(p=>`<button data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div>`:""}
      <h3>Запис</h3><dl class="facts">
        ${a.engineer?`<dt>Звукорежисер</dt><dd>${esc(a.engineer)}</dd>`:""}
        ${a.awards?`<dt>Нагороди</dt><dd>${esc(a.awards)}</dd>`:""}</dl>
      ${a.review?`<h3>Рецензія</h3><div class="review">${a.review.split(/\n\n+/).map(x=>`<p>${esc(x)}</p>`).join("")}</div>`:""}
    </div>`;
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open");
  $("#drawer").setAttribute("aria-hidden","false"); $("#drawer").scrollTop = 0;
  history.replaceState(null,"","#album="+encodeURIComponent(id));
}
function closeAlbum(){ $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden","true");
  history.replaceState(null,"", tabHash()); }
$("#scrim").onclick = closeAlbum;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeAlbum(); });
$("#drawer").onclick = e=>{
  if (e.target.closest(".close")) return closeAlbum();
  const p = e.target.closest("[data-p]"); if (p){ closeAlbum(); setTab("graph"); G.focus(p.dataset.p); }
};

/* ── ГРАФ МУЗИКАНТІВ ── */
const G = {};
function initGraph(){
  const canvas = $("#cv"), ctx = canvas.getContext("2d"), tip = $("#tip");
  const names = [...BY_ARTIST.keys()].sort((a,b)=>a.localeCompare(b));
  $("#artist-list").innerHTML = names.map(n=>`<option value="${esc(n)}">`).join("");

  // ребра: пари музикантів на одному альбомі
  const pair = new Map();
  for (const a of DB.albums){ const ps=[...new Set(a.personnel)];
    for (let i=0;i<ps.length;i++) for (let j=i+1;j<ps.length;j++){
      const k = ps[i]<ps[j] ? ps[i]+"\u0000"+ps[j] : ps[j]+"\u0000"+ps[i];
      pair.set(k,(pair.get(k)||0)+1); } }

  let showAll=false, sim, nodes=[], links=[], sel=null, hover=null, transform=d3.zoomIdentity, W=0, H=0;
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  function build(){
    const min = showAll ? 1 : 2;
    const keep = new Set(names.filter(n=>BY_ARTIST.get(n).length>=min));
    if (sel) keep.add(sel);
    const old = new Map(nodes.map(n=>[n.id,n]));
    nodes = [...keep].map(id=>old.get(id)||{id, n:BY_ARTIST.get(id).length});
    const idx = new Map(nodes.map(n=>[n.id,n]));
    links = [];
    for (const [k,w] of pair){ const [s,t]=k.split("\u0000");
      if (idx.has(s)&&idx.has(t)) links.push({source:idx.get(s),target:idx.get(t),w}); }
    sim?.stop();
    sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).distance(l=>60/Math.sqrt(l.w)).strength(l=>Math.min(1,.08*l.w)))
      .force("charge", d3.forceManyBody().strength(showAll?-45:-90))
      .force("center", d3.forceCenter(0,0))
      .force("collide", d3.forceCollide(n=>r(n)+2))
      .on("tick", draw);
  }
  const r = n => 3 + Math.sqrt(n.n)*2.6;
  const neigh = id => { const s=new Set([id]); for(const l of links){ if(l.source.id===id) s.add(l.target.id); if(l.target.id===id) s.add(l.source.id);} return s; };

  function resize(){
    const b = canvas.parentElement.getBoundingClientRect(), dpr = devicePixelRatio||1;
    W=b.width; H=b.height; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); draw();
  }
  function draw(){
    if (!W) return;
    ctx.save(); ctx.clearRect(0,0,W,H);
    ctx.translate(W/2+transform.x, H/2+transform.y); ctx.scale(transform.k, transform.k);
    const focus = sel || hover, ns = focus ? neigh(focus) : null;
    const cEdge=css("--edge"), cNode=css("--node"), cHi=css("--node-hi"), cInk=css("--ink");
    for (const l of links){
      const on = ns && (l.source.id===focus || l.target.id===focus);
      ctx.strokeStyle = on ? cHi : cEdge; ctx.globalAlpha = ns && !on ? .25 : 1;
      ctx.lineWidth = (on?1.2:.6)*Math.sqrt(l.w)/transform.k*Math.min(transform.k,1.5);
      ctx.beginPath(); ctx.moveTo(l.source.x,l.source.y); ctx.lineTo(l.target.x,l.target.y); ctx.stroke();
    }
    for (const n of nodes){
      const dim = ns && !ns.has(n.id);
      ctx.globalAlpha = dim ? .18 : 1;
      ctx.fillStyle = n.id===focus ? cHi : cNode;
      ctx.beginPath(); ctx.arc(n.x,n.y,r(n),0,7); ctx.fill();
      if ((!dim && (ns || n.n>=8)) || n.id===focus){
        ctx.fillStyle = cInk; ctx.font = `${n.id===focus?600:400} ${11/Math.sqrt(transform.k)}px Schibsted Grotesk, sans-serif`;
        ctx.textAlign="center"; ctx.fillText(n.id, n.x, n.y - r(n) - 4);
      }
    }
    ctx.restore();
  }
  function pick(e){
    const b = canvas.getBoundingClientRect();
    const [x,y] = transform.invert([e.clientX-b.left-W/2, e.clientY-b.top-H/2]);
    let best=null, bd=1e9;
    for (const n of nodes){ const d=Math.hypot(n.x-x,n.y-y); if(d<r(n)+4 && d<bd){bd=d;best=n;} }
    return best;
  }
  const zoom = d3.zoom().scaleExtent([.3,6]).on("zoom", e=>{ transform=e.transform; draw(); });
  d3.select(canvas).call(zoom).on("dblclick.zoom",null);
  canvas.addEventListener("mousemove", e=>{
    const n = pick(e); hover = n?.id||null; canvas.style.cursor = n?"pointer":"grab";
    if (n){ const b=canvas.getBoundingClientRect(); tip.style.display="block";
      tip.style.left=(e.clientX-b.left)+"px"; tip.style.top=(e.clientY-b.top)+"px";
      tip.textContent=`${n.id} · ${n.n} альб.`; } else tip.style.display="none";
    if (!sel) draw();
  });
  canvas.addEventListener("mouseleave", ()=>{ hover=null; tip.style.display="none"; draw(); });
  canvas.addEventListener("click", e=>{ const n=pick(e); if(n) focus(n.id); });

  function side(){
    const el = $("#side");
    if (!sel){
      const top = names.map(n=>[n,BY_ARTIST.get(n).length]).sort((a,b)=>b[1]-a[1]).slice(0,15);
      el.innerHTML = `<h2>Музиканти TBM</h2><p>${names.length} музикантів на ${DB.albums.length} альбомах. Клікни на коло, щоб побачити зв'язки.</p>
        <h3 style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Найчастіше на записах</h3>
        <ul>${top.map(([n,c])=>`<li><button data-a="${esc(n)}"><span class="mono">${c} альб.</span>${esc(n)}</button></li>`).join("")}</ul>`;
      return;
    }
    const albums = [...BY_ARTIST.get(sel)].sort((a,b)=>(a.year||0)-(b.year||0));
    const co = new Map();
    for (const a of albums) for (const p of a.personnel) if (p!==sel) co.set(p,(co.get(p)||0)+1);
    const topCo = [...co].sort((a,b)=>b[1]-a[1]).slice(0,10);
    const info = DB.artists[sel];
    el.innerHTML = `<h2>${esc(sel)}</h2><p>${info?.instr?esc(info.instr)+" · ":""}${albums.length} альб.
      ${info?` · <a href="${pageUrl(info.url)}">сторінка</a>`:""}</p>
      <h3 style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Альбоми</h3>
      <ul>${albums.map(a=>`<li><button data-id="${esc(a.id)}"><span class="mono">${a.year||""} ${esc(a.cat)}</span>${esc(a.title)}</button></li>`).join("")}</ul>
      ${topCo.length?`<h3 style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:18px">Найчастіше грав з</h3>
      <ul>${topCo.map(([n,c])=>`<li><button data-a="${esc(n)}"><span class="mono">${c}×</span>${esc(n)}</button></li>`).join("")}</ul>`:""}`;
  }
  $("#side").onclick = e=>{
    const a = e.target.closest("[data-a]"); if (a) return focus(a.dataset.a);
    const b = e.target.closest("[data-id]"); if (b) openAlbum(b.dataset.id);
  };

  function focus(id){
    if (!BY_ARTIST.has(id)) return;
    const need = !nodes.find(n=>n.id===id);
    sel = id; $("#gq").value = id;
    if (need) build();
    side(); draw();
    history.replaceState(null,"","#artist="+encodeURIComponent(id));
    const n = nodes.find(n=>n.id===id);
    setTimeout(()=>{ if(n?.x!=null) d3.select(canvas).transition().duration(600)
      .call(zoom.transform, d3.zoomIdentity.scale(1.6).translate(-n.x,-n.y)); }, need?600:0);
  }
  function reset(){ sel=null; $("#gq").value=""; side();
    d3.select(canvas).transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    history.replaceState(null,"","#graph"); }

  $("#gq").addEventListener("change", e=>focus(e.target.value.trim()));
  $("#g-all").onclick = e=>{ showAll=!showAll; e.currentTarget.setAttribute("aria-pressed",showAll); build(); };
  $("#g-reset").onclick = reset;
  window.addEventListener("resize", ()=>{ if(!$("#v-graph").hidden) resize(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);

  Object.assign(G,{resize,focus});
  build(); side();
}

const engName = e => (e||"").split("(")[0].trim();

/* ── ХРОНОЛОГІЯ ── */
const T = {};
function initTimeline(){
  const events = DB.events || [];
  const byYear = new Map();
  const add = (y,k,v)=>{ if(!byYear.has(y)) byYear.set(y,{albums:[],events:[],label:String(y)}); byYear.get(y)[k].push(v); };
  for (const a of DB.albums) if (a.year) add(a.year,"albums",a);
  for (const e of events){ add(e.year,"events",e); byYear.get(e.year).label = e.label || String(e.year); }
  const years = [...byYear.keys()].sort((a,b)=>a-b);
  if (!years.length) return;
  const y0 = years[0], y1 = years.at(-1);
  const maxN = Math.max(...years.map(y=>byYear.get(y).albums.length), 1);

  // каталожний номер у тексті події → альбом
  const norm = s => s.replace(/\s/g,"").toUpperCase();
  const CAT = new Map(DB.albums.map(a=>[norm(a.cat), a.id]));
  const catId = c => CAT.get(norm(c)) || CAT.get(norm(c).replace(/^TBM-/,"TBM-CD-"));
  const linkify = e => esc(e.text).replace(/TBM\s?(?:\(P\))?-(?:CD-|XR-)?\d+(?:\/\d+)?/g,
    m => { const id = catId(m); return id ? `<button data-id="${esc(id)}">${m}</button>` : m; });

  // підсвітка: музиканти + звукорежисери
  const engs = [...new Set(DB.albums.map(a=>engName(a.engineer)).filter(Boolean))];
  const hlNames = [...new Set([...BY_ARTIST.keys(), ...engs])].sort((a,b)=>a.localeCompare(b));
  $("#hl-list").innerHTML = hlNames.map(n=>`<option value="${esc(n)}">`).join("");
  let hl = null;
  const isHit = a => hl && (a.personnel.includes(hl) || engName(a.engineer)===hl);

  function render(){
    // гістограма по всіх роках діапазону
    let h = "";
    for (let y=y0; y<=y1; y++){
      const d = byYear.get(y), n = d?.albums.length||0, k = d ? d.albums.filter(isHit).length : 0;
      h += `<button class="hcol" data-y="${y}" title="${y}: ${n} альб.${d?.events.length?" · "+d.events.length+" под.":""}">
        <div class="hb" style="height:${n? 6+Math.round(n/maxN*70):2}px">${hl&&k?`<i style="height:${Math.round(k/n*100)}%"></i>`:""}</div>
        <span class="ev ${d?.events.length?"on":""}"></span><small>${y%5===0?String(y).slice(2):""}</small></button>`;
    }
    $("#hist").innerHTML = h;

    $("#years").innerHTML = years.map(y=>{
      const d = byYear.get(y);
      const al = [...d.albums].sort((a,b)=>a.cat.localeCompare(b.cat,undefined,{numeric:true}));
      return `<section class="yr" id="y${y}"><div><h2>${esc(d.label)}</h2><p>${al.length?al.length+" альб.":"подія"}</p></div><div>
        ${al.length?`<div class="ycov">${al.map(a=>`<button class="card ${hl?(isHit(a)?"hit":"dim"):""}" data-id="${esc(a.id)}" title="${esc(a.cat+" · "+a.title+" — "+a.artist)}">${sleeve(a)}</button>`).join("")}</div>`:""}
        ${d.events.length?`<ul class="evs">${d.events.map(e=>`<li>${e.date?`<b>${esc(e.date)}:</b> `:""}${linkify(e)}</li>`).join("")}</ul>`:""}
      </div></section>`;
    }).join("");
    const total = hl ? DB.albums.filter(isHit).length : 0;
    $("#tcount").textContent = hl ? `${hl}: ${total} альб.` : `${y0}–${y1} · ${events.length} подій`;
  }

  function go(y){
    const target = years.find(x=>x>=y) ?? years.at(-1);
    document.getElementById("y"+target)?.scrollIntoView({behavior:"smooth"});
    document.querySelectorAll(".hcol").forEach(c=>c.classList.toggle("cur", +c.dataset.y===target));
  }
  $("#hist").onclick = e=>{ const c=e.target.closest(".hcol"); if(c) go(+c.dataset.y); };
  $("#years").onclick = e=>{ const b=e.target.closest("[data-id]"); if(b) openAlbum(b.dataset.id); };
  $("#tq").addEventListener("change", e=>{ const v=e.target.value.trim(); hl = hlNames.includes(v) ? v : null; render();
    const first = hl && DB.albums.filter(isHit).map(a=>a.year).filter(Boolean).sort((a,b)=>a-b)[0];
    if (first) go(first); });
  $("#t-reset").onclick = ()=>{ hl=null; $("#tq").value=""; render(); };

  Object.assign(T,{go});
  render();
}

/* ── глибокі посилання: #album=TBM-23, #artist=Ім'я, #graph ── */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("album=")) openAlbum(h.slice(6));
  else if (h.startsWith("artist=")){ setTab("graph"); G.focus(h.slice(7)); }
  else if (h==="graph") setTab("graph");
  else if (h==="time") setTab("time");
  else if (h.startsWith("year=")){ setTab("time"); T.go(+h.slice(5)); }
}
</script>
