name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v5
        with:
          path: vault

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update generated pages (liner notes, artists, home)
        run: |
          python -m pip install --quiet pillow
          python vault/.github/scripts/tbm_update.py --vault vault

      - name: Save generated changes back to the repository
        run: |
          cd vault
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Liner_Notes Альбоми Артисти Інтервʼю Topics covers/thumbs index.md
          if git diff --cached --quiet; then
            echo "Нічого не змінилося"
          else
            git commit -m "Auto-update: generated pages [skip ci]"
            git pull --rebase --quiet origin main
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Clone Quartz
        run: |
          git clone -b v4 https://github.com/jackyzha0/quartz.git
          cd quartz
          rm -rf .github content
          npm ci
          # «~» між словами не має закреслювати текст (TBM-1~78): лише «~~текст~~»
          sed -i 's/\[remarkGfm, smartypants\] : \[remarkGfm\]/[[remarkGfm, { singleTilde: false }], smartypants] : [[remarkGfm, { singleTilde: false }]]/' quartz/plugins/transformers/gfm.ts
          grep -q "singleTilde: false" quartz/plugins/transformers/gfm.ts

      - name: Copy vault to Quartz content
        run: |
          cp -r vault quartz/content
          rm -rf quartz/content/.github
          rm -rf quartz/content/.git

      - name: Apply custom Quartz config
        run: |
          cp vault/.github/quartz/quartz.config.ts quartz/quartz.config.ts
          cp vault/.github/quartz/quartz.layout.ts quartz/quartz.layout.ts
          cp vault/.github/quartz/components/TBMHome.tsx quartz/quartz/components/TBMHome.tsx
          cp vault/.github/quartz/components/scripts/tbmhome.inline.ts quartz/quartz/components/scripts/tbmhome.inline.ts
          cp vault/.github/quartz/styles/custom.scss quartz/quartz/styles/custom.scss
          cp vault/.github/quartz/components/TBMFooter.tsx quartz/quartz/components/TBMFooter.tsx
          cp vault/.github/quartz/static/icon.png quartz/quartz/static/icon.png
          cp vault/.github/quartz/static/og-image.png quartz/quartz/static/og-image.png

      - name: Build Quartz
        run: |
          cd quartz
          npx quartz build

      - name: Build explorer page
        run: |
          mkdir -p quartz/public/explore
          python vault/.github/scripts/build_database.py --vault vault --out quartz/public/explore/data.json
          cp vault/.github/explore/index.html quartz/public/explore/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
